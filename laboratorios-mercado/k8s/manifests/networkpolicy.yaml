# O banco só aceita conexões do integrador (P06). O kindnet do kind 0.33 aplica NetworkPolicy (bloqueio validado pelo script).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-so-do-integrador
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: integrador
      ports:
        - protocol: TCP
          port: 5432
