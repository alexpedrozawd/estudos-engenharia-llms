# P05 — API LLMOps. Sem estado: 2 réplicas, rollout sem indisponibilidade (maxUnavailable: 0).
apiVersion: v1
kind: Service
metadata:
  name: api-llmops
spec:
  selector:
    app.kubernetes.io/name: api-llmops
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-llmops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-llmops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-llmops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-llmops
          # Imagem local carregada no kind pelo script (`kind load image-archive`); nunca baixada de registro.
          image: localhost/laboratorios-mercado:k8s-v1
          imagePullPolicy: Never
          command: ["uvicorn", "--factory", "llmops_api:criar_app_de_ambiente", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLMOPS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: aurora-segredos
                  key: LLMOPS_API_KEYS
          envFrom:
            - configMapRef:
                name: aurora-config
          # Encerramento gracioso: o pod segue atendendo 5 s depois de sair dos endpoints do Service,
          # evitando erros durante rollout (medido pelo script: sem isso, 1 a 3 falhas por troca).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /saude
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /saude
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
