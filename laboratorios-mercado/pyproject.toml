[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorios-mercado"
version = "0.1.0"
description = "Camada 3 do Guia para Engenharia de LLMs: sete projetos práticos com serviços reais (serving, RAG com pgvector e ACL, MCP, QLoRA, API LLMOps, integrador e evals/multimodal)."
readme = "README.md"
requires-python = ">=3.11"
# Dependências mínimas para os smoke-tests offline e para as execuções reais com containers.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mcp>=2.3,<3",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Validação de compose.yaml com `podman compose` quando não há docker-compose no host.
containers = ["podman-compose>=1.3"]
# Treino QLoRA real do projeto 04 (exige GPU CUDA). Fora do CI e dos smoke-tests.
finetuning = [
    "torch>=2.5",
    "transformers>=4.50",
    "peft>=0.15",
    "trl>=0.19",
    "datasets>=3.0",
    "bitsandbytes>=0.45",
    "accelerate>=1.3",
]

[tool.setuptools]
packages = ["mercado_base"]
