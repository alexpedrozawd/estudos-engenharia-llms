[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorios-mercado"
version = "0.1.0"
description = "Camada 3 do Guia para Engenharia de LLMs: oito projetos práticos com serviços reais (serving, RAG com pgvector e ACL, MCP, QLoRA, API LLMOps, integrador, evals/multimodal e agentes com LangGraph)."
readme = "README.md"
requires-python = ">=3.11"
# Dependências mínimas para os smoke-tests offline e para as execuções reais com containers.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mcp>=2.3,<3",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    # Leitura dos manifests Kubernetes nos smoke-tests do k8s/ (Etapa 6a).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Projeto 08 (LangGraph): grafo de agente, checkpointer SQLite e modelo LangChain opcional.
# langgraph-checkpoint-sqlite segue numeração própria (série 3.x em 25/11/2026).
agentes = [
    "langgraph>=1.2,<2",
    "langchain-openai>=1.8,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]
# Validação de compose.yaml com `podman compose` quando não há docker-compose no host.
containers = ["podman-compose>=1.3"]
# Treino QLoRA/LoRA real do projeto 04 (GPU NVIDIA CUDA ou AMD ROCm 7.x). Fora do CI e dos smoke-tests.
finetuning = [
    "torch>=2.5",
    "transformers>=4.50",
    "peft>=0.15",
    "trl>=0.19",
    "datasets>=3.0",
    "bitsandbytes>=0.50",
    "accelerate>=1.3",
]

[tool.setuptools]
packages = ["mercado_base"]
